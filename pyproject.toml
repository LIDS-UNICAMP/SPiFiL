[project]
name = "spifil"
version = "1.0.0"
description = "Superpixel Filter Learning: backprop-free convolutional filters learned from superpixel centers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "superpixels",
    "filter-learning",
    "representation-learning",
    "medical-imaging",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "hydra-core>=1.3",
]

[project.scripts]
spifil-fit = "spifil.cli:main"

[dependency-groups]
# DISF and geodesic centers come from PyIFT, the prebuilt wheel in vendor/.
#
# It is a dependency group and not an optional-dependency extra because an
# extra is published in the wheel's metadata: `pip install "spifil[disf]"`
# would then resolve `pyift` from PyPI --- an unrelated project of the same
# name --- since pip does not read [tool.uv.sources]. A group is local to this
# repository, so the only source of PyIFT is the vendored wheel, through
# `uv sync --group disf` or `pip install vendor/pyift-*.whl`.
#
# The marker keeps the group installable everywhere: the wheel is built for
# CPython 3.12 on linux-x86_64, and other environments get nothing from it and
# use SLIC superpixels instead.
disf = [
    "pyift; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
dev = [
    { include-group = "disf" },
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

# PyIFT is a compiled extension rather than a PyPI distribution, so a prebuilt
# wheel ships in vendor/ and installs with no extra toolchain. It links
# liblapack.so.3 and libblas.so.3 dynamically, which the wheel cannot carry:
#
#     sudo apt-get install -y liblapack3 libblas3
[tool.uv.sources]
pyift = { path = "vendor/pyift-0.1-cp312-cp312-linux_x86_64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spifil"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
files = ["src"]
strict = true
# pyift ships no type stubs; skimage and scipy ship incomplete ones.
[[tool.mypy.overrides]]
module = ["skimage.*", "scipy.*", "pyift.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a few seconds",
]
