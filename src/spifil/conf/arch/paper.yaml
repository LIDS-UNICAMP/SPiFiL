# @package arch
# The encoder reported in the SPiFiL paper: 3 layers, kernel 3, 16/32/48.
# The Eggs dataset there uses 12/30/48 instead, which is
#   arch=paper arch.layers.0.out_channels=12 arch.layers.1.out_channels=30
stdev_factor: 0.01
layers:
  - {kernel_size: 3, out_channels: 16}
  - {kernel_size: 3, out_channels: 32}
  - {kernel_size: 3, out_channels: 48}
